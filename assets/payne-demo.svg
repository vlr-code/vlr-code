<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
  <title id="t">PayneSDD demo</title>
  <desc id="d">Animated terminal: task comes in, tier named, contract, consent STOP, machine gate goes red, cause fixed, gate green, adversarial pass, verdict PASS.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .dim { fill: #8b949e; }
    .fg { fill: #c9d1d9; }
    .acc { fill: #F87C0E; }
    .red { fill: #f85149; }
    .grn { fill: #3fb950; }
    .sm { font-size: 12px; }
    .b { font-weight: 600; }
  </style>

  <!-- terminal window -->
  <rect x="8" y="8" width="664" height="384" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="32" r="6" fill="#ffbd2e"/>
  <circle cx="76" cy="32" r="6" fill="#27c93f"/>
  <text x="340" y="37" text-anchor="middle" class="dim sm">payne-sdd — session</text>
  <line x1="8" y1="52" x2="672" y2="52" stroke="#30363d" stroke-width="1"/>

  <!-- line 1 -->
  <g opacity="0">
    <text x="24" y="90"><tspan class="acc b">$</tspan><tspan class="fg" dx="8">add retry to charge() — just do it</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.025;0.0469;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>
  <!-- line 2 -->
  <g opacity="0">
    <text x="24" y="119"><tspan class="acc b">tier: FULL</tspan><tspan class="dim" dx="8">— hard floor: billing + retries</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.1125;0.1344;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>
  <!-- line 3 -->
  <g opacity="0">
    <text x="24" y="148" class="dim">contract → edge cases → acceptance criteria</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.2219;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>
  <!-- line 4 + blinking cursor -->
  <g opacity="0">
    <text x="24" y="177"><tspan class="acc b">STOP:</tspan><tspan class="fg" dx="8">build it this way?</tspan></text>
    <rect x="254" y="164" width="9" height="16" fill="#F87C0E">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2875;0.3094;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>
  <!-- line 5 -->
  <g opacity="0">
    <text x="24" y="206"><tspan class="acc b">&gt;</tspan><tspan class="fg b" dx="8">go</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.4219;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>
  <!-- line 6 -->
  <g opacity="0">
    <text x="24" y="235"><tspan class="dim">gate: npm test —</tspan><tspan class="red b" dx="8">✗ RED (2 failed)</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4875;0.5094;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>
  <!-- line 7 -->
  <g opacity="0">
    <text x="24" y="264" class="dim">fix the cause, not the test</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5875;0.6094;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>
  <!-- line 8 -->
  <g opacity="0">
    <text x="24" y="293"><tspan class="dim">gate: npm test —</tspan><tspan class="grn b" dx="8">✓ GREEN</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6875;0.7094;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>
  <!-- line 9 -->
  <g opacity="0">
    <text x="24" y="322" class="dim">adversarial: 1 finding, tied to a line — fixed</text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.775;0.7969;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>
  <!-- line 10 -->
  <g opacity="0">
    <text x="24" y="351"><tspan class="dim">verdict:</tspan><tspan class="grn b" dx="8">PASS</tspan><tspan dx="8">🚬</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8625;0.8844;0.969;1" dur="16s" repeatCount="indefinite"/>
  </g>

  <text x="340" y="380" text-anchor="middle" class="dim sm">github.com/vlr-code/PayneSDD</text>
</svg>
